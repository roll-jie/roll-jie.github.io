<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rongjie 的旅行地图与照片。">
  <title>Showcase · Rongjie</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/china-map.js" defer></script>
  <script src="travel-data.js" defer></script>
  <script src="travel-photos.js" defer></script>
  <script src="../assets/travel.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="../index.html">Rongjie</a>
      <nav class="site-nav" aria-label="主导航">
        <a href="../index.html">About</a>
        <a href="../blog/index.html">Blog</a>
        <a href="../showcase/index.html" aria-current="page">Showcase</a>
      </nav>
      <button class="theme-toggle" id="theme" type="button" aria-label="深色模式" aria-pressed="false" hidden>
        <svg class="icon theme-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.8 9.3A5.9 5.9 0 0 1 6.7 2.2a5.9 5.9 0 1 0 7.1 7.1Z"/></svg>
        <svg class="icon theme-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1m0 11v1m6.5-6.5h-1m-11 0h-1m11.1-4.6-.7.7m-7.8 7.8-.7.7m9.2 0-.7-.7M4.1 4.1l-.7-.7"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="container page-layout showcase-layout" tabindex="-1">
    <h1 class="page-title">Showcase</h1>

    <figure class="map-card">
      <svg id="travel-map" role="group" aria-label="按省份筛选旅行照片">
        <svg class="map-inset" width="127" height="151" viewBox="0 0 127 151" role="img" aria-label="南海诸岛">
          <rect class="map-inset-frame" x="1" y="1" width="125" height="149" rx="3"/>
          <svg class="map-inset-geography" x="1" y="1" width="125" height="135" viewBox="0 0 125 135"></svg>
          <text class="map-inset-label" x="63.5" y="145" text-anchor="middle">南海诸岛</text>
        </svg>
      </svg>
    </figure>

    <section class="gallery-section" aria-labelledby="gallery-heading">
      <div class="gallery-header">
        <h2 id="gallery-heading">旅行照片</h2>
        <select id="province" class="gallery-filter" aria-label="按地区筛选旅行照片" hidden>
          <option value="">全部地区</option>
        </select>
      </div>
      <p class="gallery-status" id="gallery-status" role="status">暂无照片</p>
      <div class="photo-grid" id="photos"></div>
    </section>
  </main>

  <footer class="container site-footer">© 2026 Rongjie</footer>
</body>
</html>
